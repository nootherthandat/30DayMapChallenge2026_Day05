<!DOCTYPE html>
<html>
<head>
    <title>The Queen's Line of Sight at Luneta Park</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([14.583, 120.978], 17);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        fetch('grid.geojson').then(r => r.json()).then(data => {
            L.geoJSON(data, {
                style: function(feature) {
                    // This reads the exact 'is_dark' column we just created in QGIS
                    let isDark = feature.properties.is_dark === 0;
                    
                    return {
                        color: "#333333", 
                        weight: 1, 
                        // Dark green for dark squares, white for light squares
                        fillColor: isDark ? "#4a5d23" : "#ffffff", 
                        fillOpacity: isDark ? 0.7 : 0.4
                    };
                }
            }).addTo(map);
        });

        fetch('buildings.geojson').then(r => r.json()).then(data => {
            L.geoJSON(data, {
                style: {color: "#8b0000", weight: 1, fillColor: "#d32f2f", fillOpacity: 0.8}
            }).addTo(map);
        });

        fetch('sightlines.geojson').then(r => r.json()).then(data => {
            L.geoJSON(data, {
                style: {color: "#1976d2", weight: 2, opacity: 0.8}
            }).addTo(map);
        });

        fetch('Queen.geojson').then(r => r.json()).then(data => {
            L.geoJSON(data, {
                pointToLayer: function (feature, latlng) {
                    return L.circleMarker(latlng, {
                        radius: 8, fillColor: "#9c27b0", color: "#ffffff", weight: 2, fillOpacity: 1
                    });
                }
            }).addTo(map);
        });
    </script>
</body>
</html>
